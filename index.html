<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BPM 7-Great</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/9805/9805578.png" type="image/x-icon">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #f4fbf8;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100vh;
      height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
    }

    .iframe-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #f1f5f9;
    }


    /* ========================================
       LOADING SCREEN
       Tampilan baru - modern & fresh
       ======================================== */

    .loading {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(circle at 15% 20%, rgba(16, 185, 129, 0.16), transparent 30%),
        radial-gradient(circle at 85% 25%, rgba(59, 130, 246, 0.15), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(45, 212, 191, 0.12), transparent 35%),
        linear-gradient(135deg, #f0fdf8 0%, #f8fbff 48%, #eef7ff 100%);

      z-index: 10;
      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;
    }

    .loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }


    /* Dekorasi background */

    .background-circle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(1px);
    }

    .circle-one {
      width: 220px;
      height: 220px;
      top: -90px;
      left: -80px;
      background: rgba(16, 185, 129, 0.08);
    }

    .circle-two {
      width: 280px;
      height: 280px;
      right: -120px;
      bottom: -120px;
      background: rgba(59, 130, 246, 0.08);
    }

    .circle-three {
      width: 110px;
      height: 110px;
      right: 15%;
      top: 12%;
      background: rgba(45, 212, 191, 0.07);
    }


    /* ========================================
       KONTEN LOADING
       ======================================== */

    .loading-content {
      position: relative;
      z-index: 2;

      width: min(90%, 430px);
      padding: 38px 30px 34px;

      display: flex;
      flex-direction: column;
      align-items: center;

      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 30px;

      box-shadow:
        0 25px 70px rgba(15, 23, 42, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      animation: contentAppear 0.8s ease-out;
    }

    @keyframes contentAppear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* ========================================
       ORBIT MATEMATIKA
       ======================================== */

    .math-loader {
      position: relative;

      width: 150px;
      height: 150px;

      margin-bottom: 25px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orbit {
      position: absolute;
      width: 130px;
      height: 130px;

      border: 1.5px solid rgba(16, 185, 129, 0.22);
      border-radius: 50%;

      animation: orbitSpin 7s linear infinite;
    }

    .orbit::before {
      content: "";
      position: absolute;

      width: 9px;
      height: 9px;

      top: -5px;
      left: 50%;

      transform: translateX(-50%);

      border-radius: 50%;
      background: #10b981;

      box-shadow:
        0 0 0 5px rgba(16, 185, 129, 0.10),
        0 0 18px rgba(16, 185, 129, 0.45);
    }

    .orbit-two {
      width: 105px;
      height: 105px;

      border-color: rgba(59, 130, 246, 0.20);

      animation:
        orbitSpinReverse 5.5s linear infinite;
    }

    .orbit-two::before {
      background: #3b82f6;

      box-shadow:
        0 0 0 5px rgba(59, 130, 246, 0.10),
        0 0 18px rgba(59, 130, 246, 0.40);
    }

    @keyframes orbitSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes orbitSpinReverse {
      from {
        transform: rotate(360deg);
      }

      to {
        transform: rotate(0deg);
      }
    }


    /* ========================================
       SIMBOL MATEMATIKA
       ======================================== */

    .math-symbol {
      position: absolute;

      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      font-size: 17px;
      font-weight: 700;

      background: rgba(255, 255, 255, 0.88);

      box-shadow:
        0 8px 18px rgba(15, 23, 42, 0.10),
        inset 0 0 0 1px rgba(255, 255, 255, 0.9);

      animation: symbolFloat 2.8s ease-in-out infinite;
    }

    .symbol-one {
      top: 4px;
      right: 12px;
      color: #10b981;
      animation-delay: 0s;
    }

    .symbol-two {
      bottom: 5px;
      right: 17px;
      color: #3b82f6;
      animation-delay: 0.4s;
    }

    .symbol-three {
      bottom: 6px;
      left: 15px;
      color: #f59e0b;
      animation-delay: 0.8s;
    }

    .symbol-four {
      top: 8px;
      left: 10px;
      color: #8b5cf6;
      animation-delay: 1.2s;
    }

    .symbol-five {
      top: 50%;
      right: -2px;
      color: #ef4444;
      animation-delay: 1.6s;
    }

    .symbol-six {
      top: 50%;
      left: -2px;
      color: #06b6d4;
      animation-delay: 2s;
    }

    @keyframes symbolFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }


    /* ========================================
       LOGO / BRAND
       ======================================== */

    .brand {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.5px;

      background: linear-gradient(
        90deg,
        #059669,
        #0f766e,
        #2563eb
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      margin-bottom: 5px;
    }

    .brand-subtitle {
      color: #64748b;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.8px;
      margin-bottom: 25px;
    }


    /* ========================================
       LOADING TEXT
       ======================================== */

    .loading-text {
      font-size: 0.92rem;
      font-weight: 600;
      color: #334155;

      letter-spacing: 0.2px;
      text-align: center;
    }

    .loading-text::after {
      content: '';
      animation: dots 2s infinite;
    }

    @keyframes dots {
      0%,
      20% {
        content: '';
      }

      40% {
        content: '.';
      }

      60% {
        content: '..';
      }

      80%,
      100% {
        content: '...';
      }
    }


    /* ========================================
       PROGRESS BAR
       ======================================== */

    .progress-container {
      width: 180px;
      height: 4px;

      margin-top: 15px;

      overflow: hidden;

      border-radius: 20px;

      background: rgba(148, 163, 184, 0.18);
    }

    .progress-bar {
      width: 45%;
      height: 100%;

      border-radius: 20px;

      background: linear-gradient(
        90deg,
        #10b981,
        #14b8a6,
        #3b82f6
      );

      animation: loadingProgress 1.6s ease-in-out infinite;
    }

    @keyframes loadingProgress {
      0% {
        transform: translateX(-120%);
      }

      50% {
        transform: translateX(100%);
      }

      100% {
        transform: translateX(320%);
      }
    }


    /* ========================================
       MOBILE
       ======================================== */

    @media (max-width: 480px) {

      .loading-content {
        width: 88%;
        padding: 32px 22px 28px;
        border-radius: 26px;
      }

      .math-loader {
        transform: scale(0.92);
        margin-bottom: 20px;
      }

      .brand {
        font-size: 1.35rem;
      }

      .brand-subtitle {
        font-size: 0.75rem;
        margin-bottom: 22px;
      }

      .loading-text {
        font-size: 0.85rem;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- ========================================
         LOADING SCREEN
         ======================================== -->

    <div class="loading" id="loading">

      <!-- Dekorasi background -->
      <div class="background-circle circle-one"></div>
      <div class="background-circle circle-two"></div>
      <div class="background-circle circle-three"></div>


      <div class="loading-content">

        <!-- Animasi matematika -->
        <div class="math-loader">

          <div class="orbit"></div>
          <div class="orbit orbit-two"></div>

          <div class="math-symbol symbol-one">π</div>
          <div class="math-symbol symbol-two">√</div>
          <div class="math-symbol symbol-three">∞</div>
          <div class="math-symbol symbol-four">∑</div>
          <div class="math-symbol symbol-five">÷</div>
          <div class="math-symbol symbol-six">×</div>

        </div>


        <!-- Identitas aplikasi -->
        <div class="brand">
          BPM 7G
        </div>

        <div class="brand-subtitle">
          The Great Generation
        </div>


        <!-- Loading -->
        <div class="loading-text">
          Memuat Aplikasi
        </div>

        <div class="progress-container">
          <div class="progress-bar"></div>
        </div>

      </div>

    </div>


    <!-- ========================================
         IFRAME APLIKASI
         TIDAK DIUBAH
         ======================================== -->

    <div class="iframe-container">

      <!-- allow-popups-to-escape-sandbox:
           agar tab baru dari iframe TIDAK ter-sandbox -->

      <iframe
        id="appFrame"
        src=""
        allow="fullscreen; camera; microphone"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads">
      </iframe>

    </div>

  </div>


  <script>

    // =============================================
    // URL GOOGLE APPS SCRIPT
    // TIDAK DIUBAH
    // =============================================

    var APP_URL = "https://script.google.com/macros/s/AKfycbzTlFloXUrC_56c838z3v92Q11BSHyclmKqSbylfzE2G-cWjMrbB6KIVtZcqMCXpVEh/exec";

    var appFrame = document.getElementById('appFrame');
    var loading = document.getElementById('loading');


    // =============================================
    // HANDLER REQUEST DARI IFRAME
    // TIDAK DIUBAH
    // =============================================

    window.addEventListener('message', function(event) {

      try {

        var data = event.data;

        if (!data || typeof data !== 'object') return;


        // 1. Buka tab kosong atas nama parent
        //    user gesture masih aktif

        if (data.action === 'openBlank') {

          window.open('', '_blank');

          return;
        }


        // 2. Buka URL langsung dari parent
        //    fallback jika langsung berhasil

        if (data.action === 'openDownload' && data.url) {

          window.open(data.url, '_blank');

          return;
        }


        // 3. Fullscreen dari parent document

        if (data.action === 'requestFullscreen') {

          var el = document.documentElement;

          var fn =
            el.requestFullscreen ||
            el.webkitRequestFullscreen ||
            el.msRequestFullscreen;

          if (fn) fn.call(el).catch(function(){});

          return;
        }

      } catch(e) {

        console.warn('PostMessage error:', e);

      }

    });


    // =============================================
    // LOGIKA DELAY 6 DETIK
    // TIDAK DIUBAH
    // =============================================

    var startTime = Date.now();

    var MIN_LOAD_TIME = 6000;


    function loadApp() {

      var fullUrl = window.location.href;

      var params = new URLSearchParams(window.location.search);

      var id = params.get('id');

      var targetUrl = APP_URL;


      if (id) {

        if (targetUrl.indexOf('?') !== -1) {

          targetUrl += "&id=" + id;

        } else {

          targetUrl += "?id=" + id;

        }

      }


      appFrame.src = targetUrl;

    }


    function hideLoading() {

      loading.classList.add('hidden');

    }


    appFrame.addEventListener('load', function() {

      var elapsedTime = Date.now() - startTime;

      var remainingTime = MIN_LOAD_TIME - elapsedTime;


      if (remainingTime > 0) {

        setTimeout(hideLoading, remainingTime);

      } else {

        hideLoading();

      }

    });


    window.addEventListener('DOMContentLoaded', loadApp);

  </script>

</body>
</html>
